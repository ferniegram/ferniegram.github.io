<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Extra resources generator</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link rel="stylesheet" href="/static/base.css">
    <style>
        div.main {
            padding: 25px;
        }

        #base-row button.remove {
            display: none;
        }

        div.result {
            padding-top: 50px;
        }
        div.result button {
            display: block;
        }
    </style>

    <script>
        function add() {
            const rows = document.querySelector('.rows');
            const newRow = document.querySelector('#base-row').cloneNode(true);
            newRow.removeAttribute('id');
            newRow.querySelectorAll('input').forEach(function (field) {
                field.value = '';
            });
            console.log(newRow);
            rows.appendChild(newRow);
        }

        function generate() {
            var result = [];
            document.querySelectorAll('.row').forEach(function (row) {
                let title = row.querySelector('.title').value;
                let link = row.querySelector('.link').value;
                link = new URL(link).pathname.replace(/^\//, '');
                result.push({ title, link });
            })
            document.querySelector('#data').textContent = JSON.stringify(result);
        }
    </script>
</head>
<body>
    <div class="main">
        <h1>Extra resources generator</h1>
        <div class="rows">
            <div class="row" id="base-row">
                <label for="title">Title</label>
                <input type="text" class="title" name="title">

                <label for="link">Link</label>
                <input type="text" class="link" name="link">

                <button class="remove" onclick="this.parentNode.remove()">Remove</button>
            </div>
        </div>
        <button onclick="add()">Add a link</button>

        <div class="result">
            <button onclick="generate()">Generate</button>
            <label for="data">Result:</label>
            <textarea id="data" name="data" rows="10" cols="50" placeholder="Click Generate to generate the data"></textarea>
        </div>
    </div>
</body>
</html>
